name: AI Quality Platform CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize database
        run: |
          python database/database.py

      - name: Run tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          pytest -v

      - name: Run AI evaluations
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -m evaluations.multi_prompt_runner

      - name: Run model benchmark
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -m evaluations.model_benchmark

      - name: Generate trend chart
        run: |
          python dashboard/generate_trend_chart.py

      - name: Generate dashboard
        run: |
          python -m dashboard.evaluation_dashboard_generator

      - name: Generate executive PDF
        run: |
          python reports/executive/pdf_report_generator.py

      - name: Upload reports and dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-quality-reports
          path: |
            reports/
            dashboard/evaluation_dashboard.html
            dashboard/assets/
            database/ai_evaluation.db