
    <html>
    <head>
        <title>AI Evaluation Dashboard</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                background-color: #0f172a;
                color: white;
                padding: 40px;
            }

            h1 {
                color: #38bdf8;
            }

            .cards {
                display: flex;
                gap: 20px;
                margin-top: 30px;
                flex-wrap: wrap;
            }

            .card {
                background-color: #1e293b;
                padding: 24px;
                border-radius: 14px;
                width: 220px;
                box-shadow: 0 8px 20px rgba(0,0,0,0.25);
            }

            .label {
                color: #94a3b8;
                font-size: 16px;
                margin-bottom: 10px;
            }

            .value {
                font-size: 36px;
                font-weight: bold;
            }

            .success {
                color: #22c55e;
            }

            .danger {
                color: #ef4444;
            }

            .info {
                color: #38bdf8;
            }

            table {
                width: 100%;
                margin-top: 40px;
                border-collapse: collapse;
                background-color: #1e293b;
                border-radius: 12px;
                overflow: hidden;
            }

            th, td {
                padding: 14px;
                border-bottom: 1px solid #334155;
                text-align: left;
            }

            th {
                background-color: #1e40af;
            }

            .approved {
                color: #22c55e;
                font-weight: bold;
            }

            .failed {
                color: #ef4444;
                font-weight: bold;
            }
        </style>
    </head>
    <body>
        <h1>AI Quality Evaluation Dashboard</h1>
        <p>LLM response evaluation summary based on generated JSON reports.</p>

        <div class="cards">
            <div class="card">
                <div class="label">Total Evaluations</div>
                <div class="value info">1</div>
            </div>

            <div class="card">
                <div class="label">Approved</div>
                <div class="value success">1</div>
            </div>

            <div class="card">
                <div class="label">Failed</div>
                <div class="value danger">0</div>
            </div>

            <div class="card">
                <div class="label">Average Score</div>
                <div class="value info">3.0</div>
            </div>
        </div>

        <table>
            <tr>
                <th>Timestamp</th>
                <th>Prompt</th>
                <th>Score</th>
                <th>Status</th>
                <th>Matched Keywords</th>
            </tr>
    
            <tr>
                <td>20260528_110449</td>
                <td>Explain CI/CD in simple terms.</td>
                <td>3/4</td>
                <td class="approved">APPROVED</td>
                <td>testing, deployment, integration</td>
            </tr>
        
        </table>
    </body>
    </html>
